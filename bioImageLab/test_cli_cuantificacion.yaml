nombre_pipeline: "pipeline_cuantificacion_valida"

ruta_log: "log_cuantificacion_valida.txt"
modo_qc: false
ruta_qc: "qc_cuantificacion_valida.png"
canal_qc: 0
modo_estricto: false

etapas:

  # 1. PREPROCESAMIENTO
  - preprocesamiento:
      - metodo: max_norm
        dominio: normalizacion
        canal: 0
        tipo_aplicacion: global

  # 2. FILTRACIÓN
  - filtracion:
      - metodo: fft_pasabajo
        dominio: filtracion
        canal: 0
        tipo_aplicacion: por_corte_espaciotemporal
        params:
          radio: 5

  # 3. PREPROCESAMIENTO
  - preprocesamiento:
      - metodo: to_uint8
        dominio: normalizacion
        canal: 0
        tipo_aplicacion: global

  # 4. SEGMENTACIÓN
  - segmentacion:
      - metodo: otsu
        dominio: segmentacion
        canal: 0
        tipo_aplicacion: por_corte_espaciotemporal

  # 5. CUANTIFICACIÓN
  - cuantificacion:
      - metodo: area
        dominio: cuantificacion
        canal: 0