# =====================================================================
# Repro del bug de cuantificación, respetando el orden oficial del
# pipeline (README): normalización → filtración → segmentación → cuantificación
#
# Objetivo: confirmar que el fallo NO depende del orden de etapas,
# sino de un mismatch de contrato (4D vs 2D) en los métodos de
# cuantificación concretos.
# =====================================================================

nombre_pipeline: "pipeline_cuantificacion_repro"

ruta_log:      "log_cuant_repro.txt"
modo_qc:       false
ruta_qc:       "qc_cuant_repro.png"
canal_qc:      0
modo_estricto: false

etapas:
  # 1. PREPROCESAMIENTO
  - preprocesamiento:
      - metodo: max_norm
        dominio: normalizacion
        canal: 0
        tipo_aplicacion: global

  # 2. FILTRACIÓN
  - filtracion:
      - metodo: fft_pasabajo
        dominio: filtracion
        canal: 0
        tipo_aplicacion: por_corte_espaciotemporal
        params:
          radio: 5

  # preparación de tipo para binarizar (parte de normalización, no es un paso "extra")
  - preprocesamiento:
      - metodo: to_uint8
        dominio: normalizacion
        canal: 0
        tipo_aplicacion: global

  # 5. SEGMENTADORES
  - segmentacion:
      - metodo: otsu
        dominio: segmentacion
        canal: 0
        tipo_aplicacion: por_corte_espaciotemporal

  # 6. CUANTIFICADORES
  - cuantificacion:
      - metodo: area
        dominio: cuantificacion
        canal: 0