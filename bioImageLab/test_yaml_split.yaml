# test_split_merge.yaml
nombre_pipeline: "pipeline_split_merge"
ruta_imagen:     "/home/nyarlathotep/Documentos/Programacion/ProjectosBioinformaticos/BioImageLab/bioImageLab/test_data/glp1_1.ids"
ruta_log:        "/home/nyarlathotep/Documentos/Programacion/ProjectosBioinformaticos/BioImageLab/bioImageLab/test_data/pipeline_split_merge.log"
modo_qc:         true
ruta_qc:         "/home/nyarlathotep/Documentos/Programacion/ProjectosBioinformaticos/BioImageLab/bioImageLab/test_data/qc_split_merge.png"
canal_qc:        0

etapas:
  # ── Rama principal ────────────────────────────────────────
  - preprocesamiento:
      - metodo:          max_norm
        dominio:         normalizacion
        canal:           0
        tipo_aplicacion: global

  - filtracion:
      - metodo:          fft_pasabajo
        dominio:         filtracion
        canal:           0
        tipo_aplicacion: por_corte_espaciotemporal
        params:
          radio: 5
        # Auto-checkpoint 'filtracion' guardado al final de este bloque

  # ── Rama de segmentación (split) ──────────────────────────
  - split:
      nombre: rama_seg          # checkpoint del final de la rama
      desde:  filtracion        # arranca desde el último nodo de filtracion
      etapas:
        - preprocesamiento:
            - metodo:          to_uint8
              dominio:         normalizacion
              canal:           0
              tipo_aplicacion: global

        - segmentacion:
            - metodo:          otsu
              dominio:         segmentacion
              canal:           0
              tipo_aplicacion: por_corte_espaciotemporal

  # ── Fusión imagen + máscara ───────────────────────────────
  - merge:
      nombre:     fusion
      imagen:     filtracion    # imagen filtrada (float)
      mascara:    rama_seg      # máscara binaria de Otsu
      estrategia: imagen_mascara

  # ── Cuantificación sobre la fusión ───────────────────────
  - cuantificacion:
      - metodo:  media_intensidad
        dominio: cuantificacion
        canal:   0