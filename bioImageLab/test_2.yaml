nombre_pipeline: "mi_pipeline"
ruta_imagen: "/home/nyarlathotep/Documentos/Programacion/ProjectosBioinformaticos/BioImageLab/bioImageLab/test_data/glp1_1.ids"
ruta_log:    "/home/nyarlathotep/Documentos/Programacion/ProjectosBioinformaticos/BioImageLab/bioImageLab/test_data/mi_pipeline_yaml.log"

etapas:
  - preprocesamiento:
      - metodo: max_norm
        dominio: normalizacion
        canal: 0
        tipo_aplicacion: global

  - filtracion:
      - metodo: fft_pasabajo
        dominio: filtracion
        canal: 0
        tipo_aplicacion: por_corte_espaciotemporal
        params:
          radio: 5

  # FIX: split es una clave reservada del constructor, el valor es el config del split
  - split:
      nombre: rama_segmentacion
      desde: filtracion
      etapas:
        - preprocesamiento:
            - metodo: to_uint8
              dominio: normalizacion
              canal: 0
              tipo_aplicacion: global

        - segmentacion:
            - metodo: otsu
              dominio: segmentacion
              canal: 0
              tipo_aplicacion: por_corte_espaciotemporal

  # FIX: merge es una clave reservada; imagen y mascara son los checkpoints
  - merge:
      nombre: fusion_principal
      estrategia: imagen_mascara
      imagen: filtracion
      mascara: rama_segmentacion

  - cuantificacion:
      - metodo: MediaIntensidad
        dominio: cuantificacion