nombre_pipeline: "mi_pipeline"
ruta_imagen: "/home/nyarlathotep/Documentos/Programacion/ProjectosBioinformaticos/BioImageLab/bioImageLab/test_data/glp1_1.ids"
ruta_log:    "/home/nyarlathotep/Documentos/Programacion/ProjectosBioinformaticos/BioImageLab/bioImageLab/test_data/mi_pipeline_yaml.log"

etapas:
  - preprocesamiento:
      - metodo: max_norm
        dominio: normalizacion
        canal: 0
        tipo_aplicacion: global

  - filtracion:
      - metodo: fft_pasabajo
        dominio: filtracion
        canal: 0
        tipo_aplicacion: por_corte_espaciotemporal
        params:
          radio: 5

  -split_1 (segmentacion) :
    - preprocesamiento:
        - metodo: to_uint8
          dominio: normalizacion
          canal: 0
          tipo_aplicacion: global

    - segmentacion:
        - metodo: otsu
          dominio: segmentacion
          canal: 0
          tipo_aplicacion: por_corte_espaciotemporal
  
  -merge (split_1, filtracion):

  -cuantificacion:
    -metodo: MediaIntensidad
