ruta_imagen : "/home/nyarlathotep/Documentos/Programacion/ProjectosBioinformaticos/BioImageLab/bioImageLab/test_data/glp1_1.ids"

nombre_pipeline: "mi_pipeline"

etapas:
  - preprocesamiento:
      - metodo: max_norm
        canal: 0
        tipo_aplicacion: global        # ← opcional, acepta cualquier shape

  - filtracion:
      - metodo: fft_pasabajo
        params:
          radio: 30
        canal: 0
        tipo_aplicacion: por_corte_espaciotemporal   # ← pasa [Y,X] al método

  - filtracion:
      - metodo: gaussiano
        params:
          sigma: 1.5
        canal: 0   